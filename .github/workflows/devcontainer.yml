name: Devcontainers

on:
  pull_request:
    paths:
      - .devcontainer/**
      - .github/workflows/devcontainer.yml
  push:
    branches:
      - master
    paths:
      - .devcontainer/**
      - .github/workflows/devcontainer.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test-publish:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Qt5
            containerfile: .devcontainer/debian-qt5/Containerfile
            preset: debug-kirigami-qt5
            image_suffix: qt5
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/osmscout-server-devcontainer-${{ matrix.image_suffix }}
      PACKAGE_NAME: osmscout-server-devcontainer-${{ matrix.image_suffix }}
      TEST_IMAGE: osmscout-server-devcontainer-test:${{ matrix.image_suffix }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: docker/setup-buildx-action@v3

      - name: Load dependency versions
        run: cat .devcontainer/versions.env >> "$GITHUB_ENV"

      - name: Build ${{ matrix.name }} test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.containerfile }}
          target: devcontainer
          load: true
          push: false
          tags: ${{ env.TEST_IMAGE }}
          build-args: |
            LIBPOSTAL_VERSION=${{ env.LIBPOSTAL_VERSION }}
            VALHALLA_VERSION=${{ env.VALHALLA_VERSION }}
          cache-from: type=gha,scope=devcontainer-${{ matrix.image_suffix }}
          cache-to: type=gha,mode=max,scope=devcontainer-${{ matrix.image_suffix }}

      - name: Configure, build, install, and start the ${{ matrix.name }} server
        run: |
          docker run --rm \
            --volume "${{ github.workspace }}:/workspace:ro" \
            --workdir /workspace \
            ${{ env.TEST_IMAGE }} \
            sh -lc '
              cmake --preset ${{ matrix.preset }} -B /tmp/osmscout-build -DCMAKE_INSTALL_PREFIX=/tmp/osmscout-install && \
              cmake --build /tmp/osmscout-build --parallel && \
              cmake --install /tmp/osmscout-build && {
                HOME=/tmp/osmscout-home /tmp/osmscout-install/bin/osmscout-server &
                server_pid=$!
                trap "kill $server_pid 2>/dev/null || true" EXIT
                for attempt in 1 2 3 4 5; do
                  if curl --silent --show-error --max-time 2 --output /dev/null \
                    --write-out "%{http_code}" http://127.0.0.1:8553/ \
                    | grep -Eq "^[1-5][0-9][0-9]$"; then
                    exit 0
                  fi
                  sleep 1
                done
                exit 1
              }'

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish ${{ matrix.name }} image
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.containerfile }}
          target: devcontainer
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            LIBPOSTAL_VERSION=${{ env.LIBPOSTAL_VERSION }}
            VALHALLA_VERSION=${{ env.VALHALLA_VERSION }}
          cache-from: type=gha,scope=devcontainer-${{ matrix.image_suffix }}
          cache-to: type=gha,mode=max,scope=devcontainer-${{ matrix.image_suffix }}

      - name: Keep the three newest ${{ matrix.name }} devcontainer versions
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/delete-package-versions@v5
        with:
          package-name: ${{ env.PACKAGE_NAME }}
          package-type: container
          min-versions-to-keep: 3
          token: ${{ secrets.GITHUB_TOKEN }}
